[project]
name = "guardrails-eval"
version = "0.2.0"
requires-python = ">=3.9"

[tool.ruff]
line-length = 160
target-version = "py39"
extend-exclude = ["runs", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["SIM115", "B023"]

[tool.ruff.lint.per-file-ignores]
"data/build_cases*.py" = ["E401", "E501", "I001", "B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
